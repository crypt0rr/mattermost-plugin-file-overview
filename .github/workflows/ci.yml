name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        run: npm ci
        working-directory: webapp

      - name: Apply manifest
        run: make apply

      - name: Go tests
        run: go test ./server/... ./build/...

      - name: Go coverage
        run: |
          go test ./server/... -coverprofile=server/coverage.txt
          go tool cover -func=server/coverage.txt

      - name: Go vet
        run: go vet ./server/... ./build/...

      - name: Go lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.9.0
          "$(go env GOPATH)/bin/golangci-lint" run ./server/... ./build/...

      - name: Webapp lint
        run: npm run lint
        working-directory: webapp

      - name: Webapp type check
        run: npm run check-types
        working-directory: webapp

      - name: Webapp tests and coverage
        run: npm run test:coverage
        working-directory: webapp

      - name: Build and package plugin
        run: make dist

      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: mattermost-file-overview
          path: dist/*.tar.gz
